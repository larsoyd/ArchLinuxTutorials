# Retain directory and inode caches
vm.vfs_cache_pressure = 50

# Dirty-data threshold for writing processes
vm.dirty_bytes = 268435456

# Swap readahead
vm.page-cluster = 1

# Background writeback threshold
vm.dirty_background_bytes = 67108864

# Periodic writeback interval in hundredths of a second
vm.dirty_writeback_centisecs = 1500

# Disable the NMI watchdog
kernel.nmi_watchdog = 0

# Allow unprivileged user namespaces
kernel.unprivileged_userns_clone = 1

# Limit console messages
kernel.printk = 3 3 3 3

# Restrict kernel pointer exposure
kernel.kptr_restrict = 2

# Disable kexec loading
kernel.kexec_load_disabled=1

# Disable split-lock mitigation
kernel.split_lock_mitigate = 0

# Network receive backlog
net.core.netdev_max_backlog = 4096

# System-wide file handle limit
fs.file-max = 2097152

# Use BBR with fair queue pacing
net.ipv4.tcp_congestion_control = bbr
net.core.default_qdisc = fq

# Favour swapping anonymous memory
vm.swappiness = 170

# Raise file notification limits
fs.inotify.max_user_instances = 8192
fs.inotify.max_user_watches = 524288

# Raise the virtual memory mapping limit
vm.max_map_count = 2147483642
